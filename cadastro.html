<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Frutaria Domareski</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .body-login {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #27ae60, #2d5a27);
        }
        .container-login {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; color: #666; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }
    </style>
</head>
<body class="body-login">
    <div class="container-login">
        <div class="logo" style="margin-bottom: 20px;">🍎 Frutaria <span>Domareski</span></div>
        <h2>Criar Conta</h2>
        <p style="margin-bottom: 20px; color: #666;">Cadastre-se para fazer suas compras</p>
        
        <form id="form-cadastro">
            <div class="input-group">
                <label>Nome Completo</label>
                <input type="text" id="nome-cadastro" placeholder="Seu nome" required>
            </div>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email-cadastro" placeholder="exemplo@email.com" required>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="senha-cadastro" placeholder="Crie uma senha" required>
            </div>
<button type="submit" class="btn-login" style="width: 100%; margin-top: 10px;">
    Cadastrar
</button>
        </form>
        <p style="margin-top: 15px;">Já tem conta? <a href="index.html" style="color: #27ae60; font-weight: bold;">Faça Login</a></p>
    </div>

    <script src="cadastro.js"></script>
</body>
</html>
