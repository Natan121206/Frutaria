<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo - Frutaria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">🍎 Painel <span>Administrativo</span></div>
        <nav><a href="index.html">Voltar para Loja</a></nav>
    </header>

    <main style="max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
        <h2>Cadastrar Nova Fruta</h2>
        <form id="form-admin" style="margin-top: 20px;">
            <input type="text" id="titulo" placeholder="Nome da Fruta" required style="width: 100%; padding: 10px; margin-bottom: 10px;">
            <input type="number" id="preco" placeholder="Preço (ex: 12.90)" step="0.01" required style="width: 100%; padding: 10px; margin-bottom: 10px;">
            <input type="text" id="imagem" placeholder="Nome do arquivo da imagem (ex: morango.jpg)" required style="width: 100%; padding: 10px; margin-bottom: 10px;">
            <textarea id="descricao" placeholder="Descrição curta" required style="width: 100%; padding: 10px; margin-bottom: 10px;"></textarea>
            
            <button type="submit" class="btn-principal" style="width: 100%;">Cadastrar Fruta</button>
        </form>
    </main>

    <script src="admin.js"></script>
</body>
</html>
