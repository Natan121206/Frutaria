<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Frutaria Domareski</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para a tela de login */
        .body-login {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #27ae60, #2d5a27);
        }
        .container-login {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .container-login h2 { color: #2d5a27; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; color: #666; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-login:hover { background-color: #219150; }
        #mensagem-erro { color: #e74c3c; margin-top: 15px; font-size: 0.9rem; display: none; }
    </style>
</head>
<body class="body-login">

    <div class="container-login">
        <div class="logo" style="margin-bottom: 20px;">🍎 Frutaria <span>Domareski</span></div>
        <h2>Bem-vindo</h2>
        
        <form id="form-login">
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="exemplo@email.com" required>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
            <p id="mensagem-erro">E-mail ou senha incorretos!</p>
            <p style="margin-top: 20px; color: #666; font-size: 0.9rem;">Não tem uma conta?</p>
<button onclick="window.location.href='cadastro.html'" class="btn-login" style="width: 100%; margin-top: 10px; background-color: #27ae60;">
    Criar Nova Conta
</button>

        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
