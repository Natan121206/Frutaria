<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Carrinho - Frutaria Domareski</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">🍎 Frutaria <span>Domareski</span></div>
        <nav><a href="vitrine.html">Voltar às Compras</a></nav>
    </header>

    <main id="vitrine">
        <div class="titulo-busca"><h2>Seu Carrinho</h2></div>
        
        <div id="lista-carrinho" style="max-width: 800px; margin: 0 auto;">
            </div>
        
        <div style="background: white; padding: 20px; border-radius: 10px; margin: 20px auto; max-width: 800px; border: 1px solid #eee;">
    <label for="cep" style="display: block; margin-bottom: 10px; font-weight: bold;">Calcular Entrega (CEP):</label>
    <div style="display: flex; gap: 10px;">
        <input type="text" id="cep-input" placeholder="00000-000" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; flex: 1;">
        <button onclick="calcularFrete()" class="btn-principal" style="padding: 10px 20px; margin-top: 0;">Calcular</button>
    </div>
    <p id="msg-frete" style="margin-top: 10px; color: #27ae60; font-weight: 500; display: none;"></p>
</div>


        <div id="total-carrinho" style="text-align: center; margin-top: 30px; font-size: 1.5rem; font-weight: bold;">
            Total: R$ 0,00
        </div>
        
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn-principal" onclick="finalizarCompra()">Finalizar Compra</button>
            <button onclick="limparCarrinho()" style="background: none; border: none; color: red; cursor: pointer;">Limpar Carrinho</button>
        </div>
    </main>

    <script src="carrinho.js"></script>
</body>
</html>
